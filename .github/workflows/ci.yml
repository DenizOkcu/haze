name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a newer push to main or PR update replaces the older run
# instead of stacking full matrices. Tag pushes never reach this workflow (OPS-01).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# Least privilege for the whole workflow: CI only needs to read the repo.
# Overrides any broader org/repo default for GITHUB_TOKEN scopes (SC-3).
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        include:
          # Windows is not yet a supported platform: the suite carries Unix
          # assumptions (bash, $SHELL, POSIX paths, `touch`/`sleep` in shell
          # tests) and has not been green there. Keep the signal without
          # blocking the release gate; full Windows support is a 1.x goal.
          # These entries full-match the windows combos above and only add
          # `experimental`, so no duplicate jobs are created.
          - os: windows-latest
            node-version: 22
            experimental: true
          - os: windows-latest
            node-version: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      # SHA-pinned (SC-1): major tags are mutable refs; the comments record the
      # release each commit was verified against via the GitHub tags API.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Shallow is enough here; the AGENTS.md stamp check needs full
          # history and runs in the separate `stamps` job (OPS-10).
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run release:verify
      - run: npm run build
      # Post-build artifact suite (MR-02): the real-checkout launcher test only
      # runs against a current dist; executing it after the build guarantees the
      # packaged launcher/dist pair is always exercised in CI.
      - run: npm test -- tests/cli/binLauncher.test.ts
      - run: npm audit --audit-level=high
      # Real tarball (MR-03): `npm pack` after build prints the same file list as
      # the dry run and actually creates the archive the upload step publishes.
      # The tarball content does not vary by OS/Node, so every leg still packs
      # as a smoke test but only one leg uploads it (OPS-10).
      - run: npm pack
      - name: Upload packed tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haze-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22

  # AGENTS.md last-commit stamp check needs full history, so it runs once in
  # its own job and the test matrix can stay shallow (OPS-10).
  stamps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: ./scripts/check-agents-stamps.sh

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - run: node --test website/tests/*.test.mjs

  # Supply-chain and hygiene gates run here as well as in the local pre-commit
  # hook: the hook is bypassable (--no-verify, web edits, a machine without
  # `npx lefthook install`), so CI is the authority and the hook is a fast
  # local mirror (OPS-04). Like the hook, these steps are mandatory.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # Full history so the secret scan covers every commit, not only this push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:knip
      - run: npx jscpd --min-tokens 100 --threshold 1 --reporters console src tests
      # SHA-pinned like the steps above; comments record the verified release.
      - name: Vulnerability scan of the lockfile (OSV)
        uses: google/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
      - name: Secret scan of the full history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No --log-opts range: every commit is scanned.
          args: detect --source . --no-banner --redact --verbose
