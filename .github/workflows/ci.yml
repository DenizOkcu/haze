name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the whole workflow: CI only needs to read the repo.
# Overrides any broader org/repo default for GITHUB_TOKEN scopes (SC-3).
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        include:
          # Windows is not yet a supported platform: the suite carries Unix
          # assumptions (bash, $SHELL, POSIX paths, `touch`/`sleep` in shell
          # tests) and has not been green there. Keep the signal without
          # blocking the release gate; full Windows support is a 1.x goal.
          # These entries full-match the windows combos above and only add
          # `experimental`, so no duplicate jobs are created.
          - os: windows-latest
            node-version: 22
            experimental: true
          - os: windows-latest
            node-version: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      # SHA-pinned (SC-1): major tags are mutable refs; the comments record the
      # release each commit was verified against via the GitHub tags API.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so scripts/check-agents-stamps.sh can read each
          # AGENTS.md's last-commit date.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run release:verify
      - run: npm run build
      # Post-build artifact suite (MR-02): the real-checkout launcher test only
      # runs against a current dist; executing it after the build guarantees the
      # packaged launcher/dist pair is always exercised in CI.
      - run: npm test -- tests/cli/binLauncher.test.ts
      - run: ./scripts/check-agents-stamps.sh
      - run: npm audit --audit-level=high
      # Real tarball (MR-03): `npm pack` after build prints the same file list as
      # the dry run and actually creates the archive the upload step publishes.
      - run: npm pack
      - name: Upload packed tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: haze-tarball-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14
