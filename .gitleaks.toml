# Secret-scanning configuration shared by the pre-commit hook (lefthook.yml)
# and the CI `hygiene` job (.github/workflows/ci.yml). The default rules are
# kept; the allowlist names known non-secrets only.

[extend]
useDefault = true

# jwt.io's public sample token is the redaction test fixture in
# tests/core/redaction.test.ts. It is documentation, not a credential, and a
# full-history scan would otherwise fail on the commit that introduced it.
[allowlist]
description = "jwt.io public example token used as the redaction test fixture"
paths = ['''tests/core/redaction\.test\.ts''']
regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c$''']
